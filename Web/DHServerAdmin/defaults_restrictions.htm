<!-- #include file="header.inc" -->
  <table class="crud-table" id="restr-table">
    <thead>
      <tr>
        <th>Player ID</th>
        <th class="check">Messages</th>
        <th class="check">Voice</th>
        <th class="check">Vehicle Access</th>
        <th class="check">SL/ASL Positions</th>
        <th class="check">Squad Names</th>
        <th class="textbox">Force Name</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <%ItemList%>
    </tbody>
    <tfoot>
      <tr>
        <form method="post" action="<%PostAction%>">
          <td><input class="textbox playerid" type="text" pattern="^[0-9]{17}$" maxlength="17" name="PlayerID" title="SteamID64 (17-digit Steam ID)" placeholder="Enter SteamID64" required></td>
          <td class="check"><input class="check" type="checkbox" name="OutMsg"></td>
          <td class="check"><input class="check" type="checkbox" name="OutVoice"></td>
          <td class="check"><input class="check" type="checkbox" name="VehAccess"></td>
          <td class="check"><input class="check" type="checkbox" name="LeaderPos"></td>
          <td class="check"><input class="check" type="checkbox" name="SquadName"></td>
          <td class="textbox"><input class="textbox playername" type="text" maxlength="32" name="ForcedName" title="Forced Name" placeholder="Player name"></td>
          <td><input class="button create" type="submit" name="Update" value="Create"></td>
        </form>
      </tr>
    </tfoot>
  </table>
<!-- #include file="footer.inc" -->
